name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PS5_PAYLOAD_SDK_VERSION: v0.43
  PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18

      - name: Install ps5-payload-sdk
        run: |
          wget -q -O "$RUNNER_TEMP/ps5-payload-sdk.zip" \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${PS5_PAYLOAD_SDK_VERSION}/ps5-payload-sdk.zip"
          sudo unzip -q -d /opt "$RUNNER_TEMP/ps5-payload-sdk.zip"

      - name: Build
        run: python3 build.py "$RUNNER_TEMP/sharpemu-demo"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sharpemu-demo
          path: ${{ runner.temp }}/sharpemu-demo/
          if-no-files-found: error

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.repository_owner == 'sharpemu'
    permissions:
      contents: write
    concurrency:
      group: create-release
      cancel-in-progress: false
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: sharpemu-demo
          path: sharpemu-demo

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_SHA::7}"
          (cd sharpemu-demo && zip -qr ../sharpemu-demo.zip .)
          gh release create "$tag" sharpemu-demo.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Automatic SharpEmu Demo build ($tag)" \
            --notes "Corresponding commit: ${GITHUB_SHA}"
